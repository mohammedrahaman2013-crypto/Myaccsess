<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameHub</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--panel2:#171a23;--border:#252a36;--text:#f5f7fb;--muted:#8f98a8;--accent:#7c5cff;--accent2:#22d3ee}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#7c5cff2b,transparent 28rem),radial-gradient(circle at 85% 10%,#22d3ee1c,transparent 25rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.browser{position:sticky;top:0;z-index:20;background:#090a0ee1;backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}.tabs{display:flex;gap:7px;padding:8px 10px 0;overflow:auto}.tab{min-width:170px;max-width:240px;padding:11px 14px;border:1px solid var(--border);border-bottom:0;border-radius:11px 11px 0 0;background:#0d0f14;color:var(--muted);display:flex;gap:9px;white-space:nowrap}.tab.active{background:var(--panel);color:var(--text)}.tab-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}.tab-close{margin-left:auto;opacity:.6}.new-tab{width:36px;height:36px;border:0;border-radius:9px;background:var(--panel2);color:var(--text);font-size:21px}.toolbar{display:flex;align-items:center;gap:9px;padding:9px 12px}.nav-btn{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--muted)}.address{flex:1;display:flex;align-items:center;gap:10px;background:#0e1016;border:1px solid var(--border);border-radius:12px;padding:0 13px;height:40px}.address span{color:var(--accent2);font-size:14px}.address input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}.address input::placeholder{color:#687181}main{width:min(1250px,94%);margin:auto;padding:30px 0 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:24px 0 28px}.hero h1{font-size:clamp(38px,6vw,64px);margin:0;letter-spacing:-3px}.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:10px 0 0;color:var(--muted);max-width:620px}.status{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:12px 15px;color:var(--muted);white-space:nowrap}.status b{color:#6ee7b7}.search-row{display:flex;gap:10px;margin-bottom:22px}.main-search{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px 17px;color:var(--text);outline:0}.main-search:focus{border-color:var(--accent)}.clear{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:14px;padding:0 18px}.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.category{border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:9px 14px;border-radius:999px}.category.active,.category:hover{background:var(--accent);border-color:var(--accent);color:white}.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px}.section-head h2{margin:0;font-size:22px}.count{color:var(--muted);font-size:14px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.card{background:linear-gradient(180deg,#141720,#101219);border:1px solid var(--border);border-radius:17px;overflow:hidden;transition:.18s transform,.18s border-color,.18s box-shadow}.card:hover{transform:translateY(-4px);border-color:#3a4152;box-shadow:0 15px 35px #00000052}.cover{height:135px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#191c28,#0e1017);position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#7c5cff33,transparent 60%)}.emoji{position:relative;z-index:1}.card-body{padding:14px}.card h3{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:13px;margin-bottom:13px}.play{width:100%;border:0;border-radius:10px;padding:10px;background:var(--accent);color:white;font-weight:700}.play:hover{filter:brightness(1.1)}.play.external{background:#252b38}.empty{display:none;text-align:center;padding:55px 15px;border:1px dashed var(--border);border-radius:16px;color:var(--muted)}.empty.show{display:block}footer{border-top:1px solid var(--border);padding:22px 3%;color:var(--muted);font-size:13px;text-align:center}.modal{position:fixed;inset:0;z-index:50;display:none;background:#000000bf;backdrop-filter:blur(7px);padding:25px}.modal.open{display:flex}.game-window{width:min(1100px,100%);height:min(760px,94vh);margin:auto;background:#0d0f14;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 30px 90px #0009;display:flex;flex-direction:column}.window-bar{display:flex;align-items:center;gap:12px;padding:10px 13px;border-bottom:1px solid var(--border);background:#11131a}.window-title{font-weight:700;flex:1}.window-close{width:34px;height:34px;border:0;border-radius:9px;background:#252a35;color:white;font-size:18px}.game-frame{flex:1;width:100%;border:0;background:#050609}@media(max-width:650px){.tab{min-width:145px}.status{display:none}main{width:92%}.nav-btn{display:none}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:105px;font-size:42px}.card-body{padding:11px}.card h3{font-size:15px}.modal{padding:8px}.game-window{height:96vh;border-radius:12px}}
</style>
</head>
<body>
<header class="browser"><div class="tabs"><div class="tab active"><span class="tab-dot"></span><span>GameHub</span><span class="tab-close">×</span></div><button class="new-tab" onclick="newTab()">+</button></div><div class="toolbar"><button class="nav-btn" onclick="history.back()">←</button><button class="nav-btn" onclick="history.forward()">→</button><button class="nav-btn" onclick="location.reload()">↻</button><div class="address"><span>🔒</span><input id="addressBar" value="gamehub.local" placeholder="Search or enter a website address" onkeydown="addressGo(event)"></div><button class="nav-btn" onclick="toggleMenu()">⋮</button></div></header>
<main><section class="hero"><div><h1>GAME<span>HUB</span></h1><p>Your dark-mode gaming dashboard. Search your library, filter categories, and launch games from one place.</p></div><div class="status">● <b>Online</b></div></section><div class="search-row"><input id="gameSearch" class="main-search" type="search" placeholder="🔎  Search games..." autocomplete="off"><button class="clear" onclick="clearSearch()">Clear</button></div><div id="categories" class="categories"></div><div class="section-head"><h2 id="sectionTitle">All Games</h2><span id="gameCount" class="count"></span></div><section id="games" class="games"></section><div id="empty" class="empty"><h3>No games found</h3><p>Try a different search or category.</p></div></main>
<footer>GameHub • Add your own games in the <code>games</code> array in this file.</footer>
<div id="modal" class="modal" onclick="closeOnBackdrop(event)"><div class="game-window"><div class="window-bar"><span class="tab-dot"></span><span id="windowTitle" class="window-title">Game</span><button class="window-close" onclick="closeGame()">×</button></div><div id="gameContent" style="flex:1;display:flex"></div></div></div>
<script>
const games=[
 {name:"Eaglercraft",category:"Minecraft",icon:"⛏️",url:"https://minecraftforfreex.com",embed:true},
{name:"2048",category:"Puzzle",icon:"🧩",url:"https://play2048.co/",embed:true},
{name:"Tic-Tac-Toe",category:"Puzzle",icon:"⭕",url:"https://playtictactoe.org/",embed:true},
{name:"Cookie Clicker",category:"Casual",icon:"🍪",url:"https://orteil.dashnet.org/cookieclicker/",embed:true},
{name:"Chess",category:"Strategy",icon:"♟️",url:"https://www.chess.com/play",embed:true},
{name:"Krunker",category:"Action",icon:"🎯",url:"https://krunker.io/",embed:true},
{name:"Agar.io",category:"Arcade",icon:"🟢",url:"https://agar.io/",embed:true},
{name:"Slither.io",category:"Arcade",icon:"🐍",url:"https://slither.io/",embed:true},
{name:"Paper.io",category:"Arcade",icon:"🗺️",url:"https://paper-io.com/",embed:true},
{name:"Hextris",category:"Arcade",icon:"🔷",url:"https://hextris.io/",embed:true},
{name:"Drift Hunters",category:"Racing",icon:"🏎️",url:"https://www.drifthunters.io/",embed:true}
];
let activeCategory="All";const gamesEl=document.getElementById("games"),categoriesEl=document.getElementById("categories"),searchEl=document.getElementById("gameSearch"),countEl=document.getElementById("gameCount"),titleEl=document.getElementById("sectionTitle"),emptyEl=document.getElementById("empty");const categories=["All",...new Set(games.map(g=>g.category))];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function renderCategories(){categoriesEl.innerHTML=categories.map(c=>`<button class="category ${c===activeCategory?"active":""}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>`).join("")}
function renderGames(){const q=searchEl.value.trim().toLowerCase();const filtered=games.filter(g=>(activeCategory==="All"||g.category===activeCategory)&&(!q||g.name.toLowerCase().includes(q)||g.category.toLowerCase().includes(q)));gamesEl.innerHTML=filtered.map(g=>`<article class="card"><div class="cover"><div class="emoji">${g.icon}</div></div><div class="card-body"><h3>${esc(g.name)}</h3><div class="meta">${esc(g.category)}</div><button class="play ${g.embed?"":"external"}" onclick="launchGame(${games.indexOf(g)})">${g.embed?"▶ Play here":"↗ Open game"}</button></div></article>`).join("");countEl.textContent=`${filtered.length} game${filtered.length===1?"":"s"}`;titleEl.textContent=activeCategory==="All"?"All Games":activeCategory;emptyEl.classList.toggle("show",filtered.length===0)}
function setCategory(c){activeCategory=c;renderCategories();renderGames()}function clearSearch(){searchEl.value="";renderGames();searchEl.focus()}searchEl.addEventListener("input",renderGames);
function launchGame(i){const g=games[i];if(!g)return;if(!g.embed){window.open(g.url,"_blank","noopener,noreferrer");return}document.getElementById("windowTitle").textContent=g.name;document.getElementById("gameContent").innerHTML=`<iframe class="game-frame" src="${esc(g.url)}" title="${esc(g.name)}" allowfullscreen></iframe>`;document.getElementById("modal").classList.add("open");document.body.style.overflow="hidden"}
function closeGame(){document.getElementById("modal").classList.remove("open");document.getElementById("gameContent").innerHTML="";document.body.style.overflow=""}function closeOnBackdrop(e){if(e.target.id==="modal")closeGame()}
function addressGo(e){if(e.key!=="Enter")return;const v=e.target.value.trim();if(!v)return;const isUrl=/^https?:\/\//i.test(v)||/^[\w.-]+\.[a-z]{2,}/i.test(v);const u=isUrl?(v.startsWith("http")?v:"https://"+v):"https://duckduckgo.com/?q="+encodeURIComponent(v);window.open(u,"_blank","noopener,noreferrer")}
function toggleMenu(){alert("GameHub menu\n\nEdit the games array in this HTML file to add your own games.")}function newTab(){window.open(location.href,"_blank","noopener,noreferrer")}renderCategories();renderGames();
</script>
</body></html>
